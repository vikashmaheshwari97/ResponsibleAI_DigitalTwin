services:
  secure-messenger:
    build:
      context: ./sandbox/secure_messenger
    container_name: rai-secure-messenger
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      APP_VERSION: "1.0"
      SECURITY_PROFILE: "vulnerable"
      SANDBOX_ADMIN_TOKEN: "${SANDBOX_ADMIN_TOKEN}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 256m
    cpus: 1.0
    restart: unless-stopped
    networks:
      - rai_dev

  postgres:
    image: postgres:17
    container_name: rai-postgres
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - rai_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped
    networks:
      - rai_dev

volumes:
  rai_postgres_data:

networks:
  rai_dev:
    driver: bridge
