name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-quality:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci_dummy
      SANDBOX_ADMIN_TOKEN: ci_dummy
      AUTH_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Syntax compile
        run: python -m compileall -q .
      - name: Focused Ruff checks
        run: ruff check . --select E9,F63,F7,F82
      - name: Unit tests
        run: pytest -q
